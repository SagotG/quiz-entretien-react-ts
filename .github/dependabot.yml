# Le site n'a aucune dépendance npm : seules les actions GitHub utilisées par les workflows
# sont à surveiller. Les actions sont épinglées par SHA de commit ; Dependabot met à jour
# le SHA et le commentaire de version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
